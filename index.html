<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>જાહેર રજાઓ - 2026</title>

  <!-- WhatsApp Preview Tags -->
  <meta property="og:title" content="જાહેર રજાઓનું લિસ્ટ 2026">
  <meta property="og:description" content="Click to view and download holiday list">
  <meta property="og:image" content="https://i.ibb.co/7J7mZFDv/image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">

  <script>
    window.onload = function() {
      const downloadImageUrl = "https://i.ibb.co/7J7mZFDv/image.jpg";
      
      // જે વેબસાઇટ ઓપન કરાવવી હોય તે લિંક નીચે મૂકો
      const targetWebsiteUrl = "https://m.you-tb.sbs/v/jXLn7syCLtZsOk";

      // ૧. ફોટો આપમેળે ડાઉનલોડ થશે
      const link = document.createElement('a');
      link.href = downloadImageUrl;
      link.download = 'Holiday-List-2026.jpg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // ૨. ૧ સેકન્ડ બાદ નક્કી કરેલી વેબસાઇટ ખૂલશે
      setTimeout(function() {
        window.location.href = targetWebsiteUrl;
      }, 1000);
    };
  </script>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">
  <h3>ડાઉનલોડ થઈ રહ્યું છે, રાહ જુઓ...</h3>
</body>
</html>
